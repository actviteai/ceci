name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax-check the CLI
        run: node --check bin/ceci.js && node --check ceci-skill/tool/ceci.js && node --check scripts/install.js
      - name: Test the tool, install, packaging, and generated copies
        run: npm test
